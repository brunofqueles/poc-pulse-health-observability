resources:
  jobs:
    job_manutencao:
      name: "Pulse - Job Manutencao"
      description: |
        Limpeza da Landing Zone: remove particoes com mais de 30 dias (ADR-009), com modo dry_run como padrao de seguranca. Agendado semanalmente (segunda-feira, 07:00, America/Sao_Paulo).
      tags:
        ambiente: "poc"
        projeto: "pulse-health-observability"
        dominio: "life-sciences"
      tasks:
        - task_key: limpar_landing_zone
          notebook_task:
            notebook_path: ../src/orquestracao/limpar_landing_zone.ipynb
            base_parameters:
              sistema: "todos"
              dias_retencao: "30"
              dry_run: "true"
      schedule:
        quartz_cron_expression: "0 0 7 ? * MON"
        timezone_id: "America/Sao_Paulo"
        pause_status: PAUSED